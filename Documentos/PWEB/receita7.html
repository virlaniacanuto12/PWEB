<!DOCTYPE html>
<html>   
   <head>
      <meta charset="UTF-8">   
      <link rel="stylesheet" href="receita7.css">
   </head>
   <body>
      <div style="text-align:center;">
         <button id="botaoCervejas">Carregando cervejas...</button>
      </div>
      <div id="cervejasDiv"></div>  
      
      <div style="text-align:center;">
         <button id="botaoDados">Carregar Dados</button>
      </div>
      <div id="dadosDiv"></div> 

      <!-- Carregue o arquivo JS com a função genérica -->
      <script src="receita7.js"></script>
      <script>
         // Carregar e exibir cervejas
         async function carregarCervejas() {
            try {
               const res = await fetch("https://random-data-api.com/api/v2/beers?size=3");
               const cervejas = await res.json();
               const div = document.getElementById("cervejasDiv");
               const itensHtml = cervejas.map(
                  ({ name, alcohol, ibu, blg, style }) =>
                     `<div>${name} -- ${alcohol} -- ${ibu} -- ${blg} -- ${style}</div>`
               );
               div.innerHTML = itensHtml.join("\n");
            } catch (err) {
               console.error("Erro ao carregar cervejas:", err);
               document.getElementById("cervejasDiv").innerHTML =
                  "<div style='color:red;'>Erro ao carregar cervejas</div>";
            }
         }
      
         // Adicionar evento para carregar cervejas
         document.getElementById("botaoCervejas").addEventListener("click", carregarCervejas);
      
         // Adicionar evento para carregar outros dados
         document.getElementById("botaoDados").addEventListener("click", () => {
            const url = "https://random-data-api.com/api/v2/beers?size=3"; // Altere o endpoint se necessário
            exibirDadosGenericos(url, "dadosDiv");
         });
      </script>
   </body>   
</html>
