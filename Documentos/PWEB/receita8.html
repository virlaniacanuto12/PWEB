<!DOCTYPE html>
<html>   
   <head>
      <meta charset="UTF-8">    
      <link rel="stylesheet" href="receita8.css">  
   </head>

   <body>
      <div><button id="botaoCarregar">Carregando cervejas...</button></div>
      <div id="cervejasDiv"></div>            
   </body>   

   <script>
      function gerarTabela(dados, colunas) {
         const tabela = document.createElement("table");
         const thead = tabela.createTHead();
         const tbody = tabela.createTBody();
   
         // Criar cabeçalho da tabela
         const tr = thead.insertRow();
         colunas.forEach(coluna => {
            const th = document.createElement("th");
            th.textContent = coluna;
            tr.appendChild(th);
         });
   
         // Criar corpo da tabela
         dados.forEach(dado => {
            const tr = tbody.insertRow();
            colunas.forEach(coluna => {
               const td = tr.insertCell();
               td.textContent = dado[coluna] || "N/A";
            });
         });
   
         return tabela;
      }
   
      function carregarDadosTabela() {
         fetch("https://random-data-api.com/api/v2/beers?size=3")
            .then((res) => res.json())
            .then((dados) => {
               const div = document.getElementById("cervejasDiv");
               const tabela = gerarTabela(dados, ["name", "alcohol", "ibu"]);
               div.innerHTML = ""; // Limpa o conteúdo antes de adicionar a tabela
               div.appendChild(tabela);
            })
            .catch((err) => {
               document.getElementById("cervejasDiv").innerHTML = `Erro ao carregar dados: ${err}`;
            });
      }
   
      document.getElementById("botaoCarregar").addEventListener("click", carregarDadosTabela);
   </script>

</html>
